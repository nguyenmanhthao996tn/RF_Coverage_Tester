<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoRaWAN coverage test</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 8px auto; padding: 0 8px; }
  fieldset { margin: 10px 0; }
  label { display:block; margin:6px 0 2px; font-size:13px; color:#444; }
  input[type=text], input[type=number], select { width:100%; box-sizing:border-box; padding:6px; font-family:monospace; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > div { flex:1 1 140px; }
  button { padding:8px 12px; margin:4px 4px 4px 0; }
  progress { width:100%; height:22px; }
  #known div { margin: 4px 0; }
  #log { background:#111; color:#0f0; padding:8px; min-height:160px; max-height:320px; overflow:auto; white-space:pre-wrap; font-size:12px; }
</style>

<h3>1. Bluetooth connection</h3>
<button id="scan">Scan (choose from all devices)</button>
<div style="margin-top:8px">
  <input type="text" id="nameBox" placeholder="Device name or prefix, e.g. RAK.1A2B3C" style="width:65%">
  <button id="byName">Connect by name</button>
</div>
<div><b>Known devices</b></div>
<div id="known">(none)</div>
<button id="disc" disabled>Disconnect</button>
<span id="status">not connected</span>

<h3>2. Device keys (ABP)</h3>
<fieldset>
  <label>DevEUI (16 hex)</label><input type="text" id="deveui" maxlength="16" placeholder="0000000000000000">
  <label>DevAddr (8 hex)</label><input type="text" id="devaddr" maxlength="8" placeholder="00000000">
  <label>NetSKey (32 hex)</label><input type="text" id="nwkskey" maxlength="32">
  <label>AppSKey (32 hex)</label><input type="text" id="appskey" maxlength="32">
</fieldset>

<h3>3. LoRa/LoRaWAN parameters</h3>
<fieldset>
  <div class="row">
    <div><label>Region</label><select id="region"></select></div>
    <div><label>TX power (AT+TXP index)</label><select id="txp"></select></div>
    <div><label>SF</label><select id="sf"></select></div>
    <div><label>BW (kHz)</label><select id="bw"></select></div>
    <div><label>CR</label><select id="cr"></select></div>
  </div>
</fieldset>

<h3>4. Test</h3>
<fieldset>
  <div class="row">
    <div><label>Test configuration ID (0-255)</label><input type="number" id="cfgId" value="0" min="0" max="255"></div>
    <div><label>Test sequence ID (0-255)</label><input type="number" id="seqId" value="0" min="0" max="255"></div>
    <div><label>Location ID (3 ASCII chars)</label><input type="text" id="loc" maxlength="3" placeholder="A12"></div>
  </div>
  <div class="row">
    <div><label>Total TX packets (1-65535)</label><input type="number" id="total" value="20" min="1" max="65535"></div>
    <div><label>Interval between packets (s)</label><input type="number" id="interval" value="10" min="1" max="3600"></div>
  </div>
</fieldset>

<button id="start" disabled>Start</button>
<button id="stop" disabled>Stop</button>
<progress id="bar" value="0" max="100"></progress>
<div id="progText">0 / 0</div>

<h3>Raw AT command (debug)</h3>
<input type="text" id="raw" placeholder="AT+VER=?" style="width:70%">
<button id="rawSend" disabled>Send</button>

<pre id="log"></pre>

<script>
/* ================= constants ================= */
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // phone -> device (write)
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // device -> phone (notify)
const STORE_DEV = 'ble_known_devices';
const STORE_CFG = 'lora_test_cfg';
const LORAWAN_PORT = 2;

// RUI3 AT+BAND index. Verify against the RAK AT command manual.
const REGIONS = [
  { name: 'AS923-2', band: 9  },
  { name: 'AS923-1', band: 8  },
  { name: 'AS923-3', band: 10 },
  { name: 'AS923-4', band: 11 },
  { name: 'EU868',   band: 4  },
];
// SF/BW -> LoRaWAN DR. Valid for AS923-x and EU868 uplinks.
const DR_TABLE = { '12/125':0, '11/125':1, '10/125':2, '9/125':3, '8/125':4, '7/125':5, '7/250':6 };
const BW_CODE = { 125:0, 250:1, 500:2 };   // payload byte 4
const CR_CODE = { '4/5':1 };               // payload byte 5 (1=4/5 ... 4=4/8)

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const log = s => { const l = $('log'); l.textContent += s; l.scrollTop = l.scrollHeight; };
const sleepers = new Set();
const sleep = ms => new Promise(r => { const t = setTimeout(() => { sleepers.delete(w); r(); }, ms); const w = () => { clearTimeout(t); r(); }; sleepers.add(w); });
const wakeAll = () => { [...sleepers].forEach(w => w()); sleepers.clear(); };
const isHex = (s, n) => new RegExp(`^[0-9a-fA-F]{${n}}$`).test(s);

if (!navigator.bluetooth) log('Web Bluetooth not supported in this browser/OS\n');

/* ================= form setup ================= */
function fill(sel, items, def) {
  items.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.append(o); });
  if (def !== undefined) sel.value = def;
}
fill($('region'), REGIONS.map(r => [r.name, r.name]), 'AS923-2');
fill($('txp'), [...Array(8).keys()].map(i => [i, i === 0 ? '0 (max)' : String(i)]), 0);
fill($('sf'),  [12, 11, 10, 9, 8, 7].map(s => [s, 'SF' + s]), 7);
fill($('bw'),  [[125, '125'], [250, '250']], 125);   // 500 kHz not valid for AS923/EU868 uplinks
fill($('cr'),  [['4/5', '4/5']], '4/5');             // LoRaWAN fixes CR at 4/5

const CFG_FIELDS = ['deveui','devaddr','nwkskey','appskey','region','txp','sf','bw','cr','cfgId','seqId','loc','total','interval'];
function saveCfg() { try { localStorage.setItem(STORE_CFG, JSON.stringify(Object.fromEntries(CFG_FIELDS.map(k => [k, $(k).value])))); } catch {} }
function loadCfg() { try { const c = JSON.parse(localStorage.getItem(STORE_CFG) || '{}'); CFG_FIELDS.forEach(k => { if (c[k] !== undefined) $(k).value = c[k]; }); } catch {} }
CFG_FIELDS.forEach(k => $(k).addEventListener('change', saveCfg));
loadCfg();

/* ================= known-device list ================= */
let dev = null, rx = null;
const known = new Map();

function saveKnown() { try { localStorage.setItem(STORE_DEV, JSON.stringify([...known.values()].map(({id, name}) => ({id, name})))); } catch {} }
async function loadKnown() {
  try { JSON.parse(localStorage.getItem(STORE_DEV) || '[]').forEach(d => known.set(d.id, { id: d.id, name: d.name, obj: null })); } catch {}
  if (navigator.bluetooth && navigator.bluetooth.getDevices) {
    try {
      (await navigator.bluetooth.getDevices()).forEach(d => {
        const e = known.get(d.id) || { id: d.id, name: d.name, obj: null };
        e.obj = d; e.name = d.name || e.name; known.set(d.id, e);
      });
    } catch (e) { log(`[getDevices unavailable] ${e.message}\n`); }
  } else log('[note] getDevices() not available; reconnect will use the chooser\n');
  saveKnown(); renderKnown();
}
function rememberDevice(d) {
  const e = known.get(d.id) || { id: d.id };
  e.name = d.name || e.name || '(unnamed)'; e.obj = d; known.set(d.id, e);
  saveKnown(); renderKnown();
}
function renderKnown() {
  const box = $('known'); box.textContent = '';
  if (!known.size) { box.textContent = '(none)'; return; }
  for (const e of known.values()) {
    const row = document.createElement('div');
    const label = document.createElement('span');
    label.textContent = `${e.name || '(unnamed)'}  [${e.id.slice(0, 8)}…]  `;
    const c = document.createElement('button'); c.textContent = 'Connect'; c.onclick = () => connectKnown(e);
    const f = document.createElement('button'); f.textContent = 'Forget';
    f.onclick = async () => { try { if (e.obj && e.obj.forget) await e.obj.forget(); } catch {} known.delete(e.id); saveKnown(); renderKnown(); };
    row.append(label, c, f); box.append(row);
  }
}

/* ================= UI state ================= */
let running = false, stopFlag = false, connected = false;
function refreshUi() {
  $('scan').disabled = connected; $('byName').disabled = connected;
  $('disc').disabled = !connected || running;
  $('start').disabled = !connected || running;
  $('stop').disabled = !running;
  $('rawSend').disabled = !connected || running;
  ['deveui','devaddr','nwkskey','appskey','region','txp','sf','bw','cr','cfgId','seqId','loc','total','interval']
    .forEach(k => $(k).disabled = running);
  $('status').textContent = connected ? `connected: ${dev && dev.name || ''}` : 'not connected';
}

/* ================= line-based RX + AT command layer ================= */
const decoder = new TextDecoder();
let rxBuf = '';
let pending = null;     // { lines, done(ok) }

function onNotify(e) {
  rxBuf += decoder.decode(e.target.value, { stream: true });
  let i;
  while ((i = rxBuf.search(/\r\n|\n|\r/)) >= 0) {
    const line = rxBuf.slice(0, i).trim();
    rxBuf = rxBuf.slice(i).replace(/^(\r\n|\n|\r)/, '');
    if (line) onLine(line);
  }
}
function onLine(line) {
  log(`< ${line}\n`);
  if (!pending) return;
  if (line === 'OK') pending.done(true);
  else if (/^AT_/.test(line)) { pending.lines.push(line); pending.done(false); }
  else if (!/^\+EVT/.test(line)) pending.lines.push(line);
}

async function writeText(s) {
  const data = new TextEncoder().encode(s);
  for (let i = 0; i < data.length; i += 20) await rx.writeValueWithoutResponse(data.slice(i, i + 20));
}
function cmd(c, timeout = 5000) {
  return new Promise((resolve, reject) => {
    if (!rx) return reject(new Error('not connected'));
    const lines = [];
    const t = setTimeout(() => { pending = null; reject(new Error('timeout: ' + c)); }, timeout);
    pending = { lines, done: ok => { clearTimeout(t); pending = null; ok ? resolve(lines) : reject(new Error(lines.join(' ') || 'error')); } };
    log(`> ${c}\n`);
    writeText(c + '\r\n').catch(e => { clearTimeout(t); pending = null; reject(e); });
  });
}

/* ================= connection ================= */
function onDisconnected() {
  rx = null; connected = false; stopFlag = true;
  if (pending) pending.done(false);
  wakeAll(); refreshUi(); log('[disconnected]\n');
}
async function connectTo(device) {
  dev = device;
  dev.removeEventListener('gattserverdisconnected', onDisconnected);
  dev.addEventListener('gattserverdisconnected', onDisconnected);
  try {
    log(`[connecting] ${dev.name || '(unnamed)'}\n`);
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rx = await svc.getCharacteristic(RX);
    const tx = await svc.getCharacteristic(TX);
    tx.removeEventListener('characteristicvaluechanged', onNotify);
    tx.addEventListener('characteristicvaluechanged', onNotify);
    await tx.startNotifications();
    rxBuf = '';
    rememberDevice(dev);
    connected = true; refreshUi(); log('[connected]\n');
  } catch (e) {
    log(`[error] ${e.message}\n`);
    if (dev.gatt.connected) dev.gatt.disconnect();
    rx = null; connected = false; refreshUi();
  }
}
async function chooser(options) {
  try {
    const d = await navigator.bluetooth.requestDevice({ ...options, optionalServices: [NUS] });
    rememberDevice(d); await connectTo(d);
  } catch (e) { log(`[${e.name === 'NotFoundError' ? 'cancelled' : 'error'}] ${e.message}\n`); }
}
async function connectKnown(e) {
  if (e.obj) return connectTo(e.obj);
  if (e.name && e.name !== '(unnamed)') chooser({ filters: [{ name: e.name }] });
  else chooser({ acceptAllDevices: true });
}
$('scan').onclick = () => chooser({ acceptAllDevices: true });
$('byName').onclick = () => {
  const n = $('nameBox').value.trim();
  if (!n) return log('[enter a name or prefix first]\n');
  chooser({ filters: [{ namePrefix: n }] });
};
$('disc').onclick = () => dev && dev.gatt.connected && dev.gatt.disconnect();

$('rawSend').onclick = async () => {
  const c = $('raw').value.trim(); if (!c) return;
  try { await cmd(c); } catch (e) { log(`[error] ${e.message}\n`); }
};

/* ================= test run ================= */
function readParams() {
  const p = {};
  p.deveui  = $('deveui').value.trim();
  p.devaddr = $('devaddr').value.trim();
  p.nwkskey = $('nwkskey').value.trim();
  p.appskey = $('appskey').value.trim();
  if (!isHex(p.deveui, 16))  throw new Error('DevEUI must be 16 hex characters');
  if (!isHex(p.devaddr, 8))  throw new Error('DevAddr must be 8 hex characters');
  if (!isHex(p.nwkskey, 32)) throw new Error('NetSKey must be 32 hex characters');
  if (!isHex(p.appskey, 32)) throw new Error('AppSKey must be 32 hex characters');

  p.region = REGIONS.find(r => r.name === $('region').value);
  p.txp = parseInt($('txp').value, 10);
  p.sf  = parseInt($('sf').value, 10);
  p.bw  = parseInt($('bw').value, 10);
  p.cr  = $('cr').value;
  const dr = DR_TABLE[`${p.sf}/${p.bw}`];
  if (dr === undefined) throw new Error(`SF${p.sf}/BW${p.bw} is not a valid uplink data rate for this region`);
  p.dr = dr;

  const byte = (id, name) => { const v = parseInt($(id).value, 10); if (!(v >= 0 && v <= 255)) throw new Error(name + ' must be 0-255'); return v; };
  p.cfgId = byte('cfgId', 'Test configuration ID');
  p.seqId = byte('seqId', 'Test sequence ID');

  p.loc = $('loc').value;
  if (!/^[\x21-\x7e]{3}$/.test(p.loc)) throw new Error('Location ID must be exactly 3 printable ASCII characters');

  p.total = parseInt($('total').value, 10);
  if (!(p.total >= 1 && p.total <= 65535)) throw new Error('Total TX packets must be 1-65535');
  p.interval = parseInt($('interval').value, 10);
  if (!(p.interval >= 1)) throw new Error('Interval must be at least 1 second');
  return p;
}

function buildPayload(p, n) {
  const b = new Uint8Array(13);
  b[0] = p.cfgId;
  b[1] = p.seqId;
  b[2] = p.txp;                       // AT+TXP index (see notes)
  b[3] = p.sf;
  b[4] = BW_CODE[p.bw];
  b[5] = CR_CODE[p.cr];
  for (let i = 0; i < 3; i++) b[6 + i] = p.loc.charCodeAt(i);
  b[9]  = (p.total >> 8) & 0xff; b[10] = p.total & 0xff;   // big-endian
  b[11] = (n >> 8) & 0xff;       b[12] = n & 0xff;         // big-endian
  return [...b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
}

function setProgress(n, total) {
  $('bar').max = total; $('bar').value = n;
  $('progText').textContent = `${n} / ${total}`;
}

async function runSetup(p) {
  log('[setup]\n');
  const nwm = await cmd('AT+NWM=?').catch(() => []);
  if (nwm.length && nwm[0].trim() === '0')
    throw new Error('Device is in P2P mode. Set AT+NWM=1 (this reboots the device), reconnect, then retry');
  await cmd('AT+NJM=0');                        // ABP
  await cmd('AT+CLASS=A');
  await cmd(`AT+BAND=${p.region.band}`);
  await cmd(`AT+DEVEUI=${p.deveui}`);
  await cmd(`AT+DEVADDR=${p.devaddr}`);
  await cmd(`AT+NWKSKEY=${p.nwkskey}`);
  await cmd(`AT+APPSKEY=${p.appskey}`);
  await cmd('AT+ADR=0');
  await cmd('AT+CFM=0');                        // unconfirmed
  await cmd(`AT+DR=${p.dr}`);
  await cmd(`AT+TXP=${p.txp}`);
  log('[setup done]\n');
}

async function sendWithRetry(hex) {
  let lastErr;
  for (let attempt = 1; attempt <= 3; attempt++) {
    if (stopFlag) return false;
    try { await cmd(`AT+SEND=${LORAWAN_PORT}:${hex}`, 20000); return true; }
    catch (e) { lastErr = e; log(`[send failed ${attempt}/3] ${e.message}\n`); await sleep(3000); }
  }
  throw lastErr;
}

async function startTest() {
  let p;
  try { p = readParams(); } catch (e) { return log(`[invalid] ${e.message}\n`); }
  saveCfg();
  running = true; stopFlag = false; refreshUi(); setProgress(0, p.total);
  let sent = 0;
  try {
    await runSetup(p);
    for (let n = 0; n < p.total; n++) {
      if (stopFlag) break;
      const hex = buildPayload(p, n);
      log(`[tx ${n + 1}/${p.total}] ${hex}\n`);
      if (!(await sendWithRetry(hex))) break;
      sent = n + 1; setProgress(sent, p.total);
      if (n < p.total - 1) await sleep(p.interval * 1000);
    }
    log(stopFlag ? `[stopped] ${sent}/${p.total} sent\n` : `[done] ${sent}/${p.total} sent\n`);
  } catch (e) {
    log(`[aborted] ${e.message}\n`);
  } finally {
    running = false; refreshUi();
  }
}
$('start').onclick = startTest;
$('stop').onclick = () => { stopFlag = true; wakeAll(); };

refreshUi();
loadKnown();
</script>
