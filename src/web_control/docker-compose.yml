services:
  web:
    container_name: rf-coverage-tester-web
    image: busybox:1.37-musl
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./www/:/www:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 16m
